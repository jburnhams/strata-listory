[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strata-listory"
version = "0.1.0"
description = "Catalogues and processes audiobooks: ingest, identification against Audible and Open Library, and a review web app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "zstandard; python_version < '3.14'",
    "strata-python",            # the strata-check gate (and, later, the shared server code)
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
app = "app.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis",
    "pytest-randomly",
    "pytest-timeout",
    "pytest-xdist",
    "diff-cover",
    "ruff",
    "pyright",
    "ty",
    "numpy>=2.1,<3",            # array operations in offline model tests; estimators are faked
]
# The Postgres layer (src/app/store): the catalogue lives in the shared database. A server installs it with `uv sync --no-dev --group db`; the tests need it too (default-groups).
db = [
    "omarchy-db",
    "psycopg[binary]",
]
# Signal-analysis tools; the core ingest pipeline remains usable without them.
audio = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
]
# Offline matching experiments; not application/server dependencies.
model = [
    "scikit-learn>=1.7,<2",
    "xgboost-cpu>=3,<4; (sys_platform == 'linux' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "xgboost>=3,<4; (sys_platform != 'linux' and sys_platform != 'win32') or (platform_machine != 'x86_64' and platform_machine != 'AMD64')",
]

[tool.uv]
default-groups = ["dev", "db"]

[tool.uv.sources]
# strata-python tracks main (no tag): uv.lock pins the commit, `uv lock --upgrade-package strata-python` moves it
strata-python = { git = "https://github.com/jburnhams/strata-python" }
omarchy-db = { git = "https://github.com/jburnhams/database", subdirectory = "python" }

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests/utils"]
testpaths = ["tests/unit"]
addopts = "-ra --timeout=300 --ignore=tests/unit/store"       # the Postgres layer needs a server: .github/workflows/store.yml runs tests/unit/store on a throwaway PostgreSQL (with -o addopts=)
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]       # TestClient noise from the installed starlette; remove when the dependency moves on
markers = [
    "integration: runs the CLI and HTTP server end-to-end (tests/integration)",
    "slow: slow tests; run manually or on a schedule",
    "year_lookup: exercises the real original-year lookup instead of the stored-extras stub (tests/conftest.py)",
]

[tool.coverage.run]
source = ["src/app"]
branch = true
omit = ["*/__main__.py", "src/app/store/*", "src/app/pipeline_steps.py", "src/app/linkage/apply.py", "src/app/linkage/files.py", "src/app/linkage/api.py", "src/app/linkage/service.py", "src/app/covers/run.py", "src/app/covers/api.py"]     # the Postgres layer is covered by .github/workflows/store.yml (needs a server)

[tool.coverage.report]
skip_empty = true
show_missing = false
# Measured from the unit suite only (tests/unit). Ratchet this up as coverage improves.
# 95 -> 93 on 2026-11-09 with no test lost: `ruff format` split one-line `if x: return y` into two lines and coverage counts lines, so the same unexecuted branches count twice.
fail_under = 93

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "S", "TID"]
ignore = [
    "E501",    # the formatter wraps code; long comments and docstrings stay (the house style comments the why)
    "C408",    # dict(a=1) and list() calls are the house style for records
    "PT018",   # `assert a and b` is kept: one line says what holds
    "E731",    # short named lambdas
    "E741",    # one-letter names in short comprehensions
    "SIM115",  # files opened for the life of an object are closed by it
    "RUF005", "RUF046", "RUF001", "RUF002", "RUF003", "RUF043", "RUF012", "UP031", "B008",   # style-only findings, in code that is fine as written
    "B904", "B905", "RUF059", "RUF007",   # existing code: raises inside except, zips without strict, unused unpacked names; fixing them is its own change
    "S110", "S112", "S301", "S307", "S310", "S314", "S324", "S603", "S607", "SIM105",   # best-effort cleanup, hashes for cache keys, our own pickles and subprocesses (ffmpeg, mp3gain)
    "PT012", "PT013", "PT006",
    "S608",    # SQL assembled from module-level fragments (column lists, placeholders); the values are bound parameters. Audit before adding any new f-string query
    "RUF071", "B005", "RUF017", "UP022", "RUF015", "RUF057", "B018",   # existing code, to be looked at one rule at a time (RUF071 and B005 can be real bugs)
    "B023", "B007", "F841", "C416", "C401", "SIM102", "PT011", "PT028", "B017", "E402", "E721",   # existing code, to be cleaned up one rule at a time (B023 and F841 first: they can hide bugs)
    "S311",    # random is used for jitter and sampling, never for secrets
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pytest.importorskip".msg = "Do not skip when a dependency is missing: install it (locally and in CI) and let the test fail if it is not there. A deliberate skip is a marker with a reason, see AGENTS.md (Testing)."

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["S101"]
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S603", "S607"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Ratchet: files listed here are checked strictly; the rest (typed in follow-up PRs) in basic mode. Add a file when it is fully annotated; never remove one.
strict = ["src/app/__init__.py"]
# Findings in the code that is not yet in the strict list are warnings, so they are visible without blocking: dict(...) literals whose value types pyright narrows too far,
# and SQLAlchemy/NumPy stubs. They become errors file by file as each file moves into the list.
reportArgumentType = "warning"
reportCallIssue = "warning"
reportIndexIssue = "warning"
reportOptionalOperand = "warning"
reportOptionalSubscript = "warning"
reportOptionalMemberAccess = "warning"
reportOperatorIssue = "warning"
reportAttributeAccessIssue = "warning"
reportMissingImports = "warning"      # optional packages (scipy, scikit-learn, xgboost) are only installed with their group
reportMissingTypeStubs = "warning"
reportPossiblyUnbound = "warning"
reportReturnType = "warning"
reportAssignmentType = "warning"
reportGeneralTypeIssues = "warning"
reportOptionalIterable = "warning"
reportRedeclaration = "warning"       # oslib-style version-dependent definitions (compression.zstd on 3.14, zstandard before)

[tool.ty.rules]
# ty exits 1 on warnings too, so the rules below are off, not warnings. pyright (above) reports the same code as visible warnings and is the ratchet; turn a rule back on
# here once pyright's matching warning is gone.
call-non-callable = "ignore"
import-not-found = "ignore"
invalid-assignment = "ignore"
invalid-argument-type = "ignore"
no-matching-overload = "ignore"
not-subscriptable = "ignore"
missing-attribute = "ignore"
unresolved-global = "ignore"
unsupported-operator = "ignore"
missing-union-attribute = "ignore"
invalid-return-type = "ignore"
lost-keyword-for-regular-parameter = "ignore"
not-iterable = "ignore"
too-many-positional-arguments = "ignore"
unknown-argument = "ignore"
redundant-condition = "ignore"

[tool.omarchy-db]
app = "listory"
models = "app.store.models:Base"
migrations = "migrations"
engine = "postgres"             # JSONB, partial unique indexes and CHECKs with casts: Postgres only (unit tests for this layer run with `pytest --pg`)
