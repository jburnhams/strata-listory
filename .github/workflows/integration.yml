name: Integration tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked
      - name: Install and verify FFmpeg and ffprobe for real-audio integration tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg
          elif [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg
          else choco install ffmpeg -y --no-progress || true
            # Windows: the Chocolatey feed has refused ffmpeg (2026-11-25: a 504, "installed 0/0 packages" and exit 0), so fall back to BtbN's static build
            if ! command -v ffmpeg >/dev/null; then curl -fsSL --retry 4 -o "$RUNNER_TEMP/ffmpeg.zip" https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip && unzip -q "$RUNNER_TEMP/ffmpeg.zip" -d "$RUNNER_TEMP/ffmpeg" && b="$RUNNER_TEMP/ffmpeg/ffmpeg-master-latest-win64-gpl/bin" && cygpath -w "$b" >> "$GITHUB_PATH" && export PATH="$b:$PATH"; fi
          fi
          ffmpeg -version
          ffprobe -version
      - name: Integration tests (CLI and HTTP API end-to-end)
        run: uv run pytest tests/integration -n auto --durations=10

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:integration
