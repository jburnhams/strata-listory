name: Postgres store

# The listen catalogue (src/app/store) on a real PostgreSQL 18: migrations from empty, drift check and the model tests.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  store:
    # dbtool check and tests/unit/store on a throwaway Postgres 18, through the shared workflow in jburnhams/database
    uses: jburnhams/database/.github/workflows/app-db.yml@main
    with:
      install: pip install -r requirements-test.txt
      tests: tests/unit/store
      pytest-args: "-o addopts= -p no:randomly"
