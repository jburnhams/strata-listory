name: Postgres store

# The listen catalogue (src/app/store) on a real PostgreSQL 18: migrations from empty, drift check and the model tests.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres  # throwaway CI container gitleaks:allow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OMARCHY_DB_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres  # throwaway CI container gitleaks:allow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-test.txt "omarchy-db @ git+https://github.com/jburnhams/database#subdirectory=python"
      - run: dbtool check
      - run: pytest tests/unit/store --pg -p no:randomly
